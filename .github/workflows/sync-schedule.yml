name: Sync — calendrier des matchs

# Appelle /api/sync/schedule (T4/T8) : rattache les matchs Highlightly aux
# séries internes. 1x/jour (doc maître §2, A8) — pas besoin de plus, le
# calendrier ne change pas d'heure en heure. GitHub Actions n'exécute qu'en
# UTC : 08:00 UTC = 09:00 ou 10:00 heure de Paris selon l'heure d'été.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {} # déclenchement manuel possible depuis l'onglet Actions.

jobs:
  call:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Appeler /api/sync/schedule
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "https://nba-pronos.vercel.app/api/sync/schedule"

      # Alerte minimale (Phase 0, GAPS_OUVERTS.md) : pas d'infra de monitoring
      # dédiée, une issue GitHub auto-créée suffit. Dédupliquée par titre (une
      # seule issue ouverte à la fois par workflow, pas une par run raté).
      - name: Alerter en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Échec planifié : Sync — calendrier des matchs";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["cron-failure"],
              body: `Le workflow planifié a échoué. Détails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
