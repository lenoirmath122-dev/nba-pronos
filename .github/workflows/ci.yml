name: CI

# Garde-fou de code (lint + types + tests + build), pas un job planifié comme
# les 8 autres workflows du dépôt. Se déclenche à chaque push et sur les PR
# (aucune n'existe encore, mais ça couvre le jour où il y en aura). Aucun
# secret nécessaire : `npm run build` a été vérifié en local sans clés
# Supabase réelles (les clients Supabase sont créés paresseusement, jamais au
# chargement d'un module) — voir BILAN_GLOBAL_01_09_2026.md.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests (vitest) + seuil de couverture (p1-3)
        run: npm run test:coverage

      - name: Build (next build)
        run: npm run build

      - name: Aucune route pré-rendue statiquement par erreur (p1-4, T-SMOKE-02)
        run: npm run check:static-routes

      - name: Audit de dépendances (bundle runtime, non bloquant)
        # --omit=dev : seul le code livré aux utilisateurs compte ici (les
        # vulnérabilités dev-only, ex. la chaîne de build browserslist/
        # postcss, n'affectent jamais le runtime servi -- SEC-002/OPS-003).
        # continue-on-error : détecte une dérive sans faire échouer le build
        # sur une vulnérabilité tierce qu'on ne peut pas corriger seul le
        # jour même (ANOMALIES.md, OPS-003).
        run: npm audit --omit=dev
        continue-on-error: true

  e2e:
    # Job séparé (pas une étape de `checks`) : nécessite Docker (Supabase
    # local) + navigateur Chromium, sensiblement plus lent -- ne doit pas
    # ralentir le retour rapide de lint/types/tests unitaires. ubuntu-latest
    # fournit Docker nativement, aucun secret requis (Supabase local +
    # identifiants de test fixes, voir e2e/seed.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Supabase local (Docker)
        run: npx supabase start

      - name: Tests d'intégration RLS/permissions
        # Réutilise le Supabase local déjà démarré ci-dessus (même instance
        # que les specs e2e) — TEST-002/A4 (ANOMALIES.md) avait le test écrit
        # depuis le 04/09/2026 mais jamais branché en CI, seulement lancé à la
        # main (GAPS_OUVERTS.md, Phase 0).
        run: npm run test:integration

      - name: Navigateur Playwright
        # mobile-chrome (p1-2, Phase 1) réutilise le moteur chromium déjà
        # installé -- pas de nouveau binaire nécessaire pour ce projet.
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright)
        run: npm run test:e2e

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  stats-service:
    # Job séparé (comme e2e) : p1-5 (feuille de route Phase 1) -- un vrai
    # `docker build` + démarrage du conteneur aurait attrapé le bug réel du
    # 02/09/2026 (tuning.py manquant dans la liste COPY du Dockerfile --
    # crash au démarrage AVANT même d'écouter sur le port ; Cloud Run le
    # rapportait à tort comme "failed to start and listen on PORT", la
    # vraie cause était dans les logs du conteneur, pas dans `gcloud run
    # deploy`). Cadrage/Stats/models/ est gitignoré (920 Mo de modèles
    # entraînés, jamais commités -- p1-10) : /health tolère explicitement
    # leur absence (app.py : "healthcheck simple sans Supabase joignable",
    # client Supabase construit paresseusement, jamais au chargement du
    # module) -- un dossier models/ VIDE suffit pour que `COPY models/
    # ./models/` du Dockerfile ne casse pas, aucune vraie donnée
    # nécessaire pour vérifier que le service démarre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dossier models/ vide (gitignoré -- /health n'en a pas besoin)
        run: mkdir -p Cadrage/Stats/models

      - name: Build de l'image (celle déployée sur Cloud Run)
        run: docker build -f Cadrage/Stats/Dockerfile -t nba-pronos-stats-test Cadrage/Stats

      - name: Démarrage du conteneur
        run: docker run -d --name stats-test -p 8080:8080 nba-pronos-stats-test

      - name: /health répond 200 (le service a démarré, toutes ses dépendances se sont importées)
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health n'a jamais répondu -- logs du conteneur :"
          docker logs stats-test
          exit 1
