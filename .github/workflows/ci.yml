name: CI

# Garde-fou de code (lint + types + tests + build), pas un job planifié comme
# les 8 autres workflows du dépôt. Se déclenche à chaque push et sur les PR
# (aucune n'existe encore, mais ça couvre le jour où il y en aura). Aucun
# secret nécessaire : `npm run build` a été vérifié en local sans clés
# Supabase réelles (les clients Supabase sont créés paresseusement, jamais au
# chargement d'un module) — voir BILAN_GLOBAL_01_09_2026.md.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build

      - name: Audit de dépendances (bundle runtime, non bloquant)
        # --omit=dev : seul le code livré aux utilisateurs compte ici (les
        # vulnérabilités dev-only, ex. la chaîne de build browserslist/
        # postcss, n'affectent jamais le runtime servi -- SEC-002/OPS-003).
        # continue-on-error : détecte une dérive sans faire échouer le build
        # sur une vulnérabilité tierce qu'on ne peut pas corriger seul le
        # jour même (ANOMALIES.md, OPS-003).
        run: npm audit --omit=dev
        continue-on-error: true

  e2e:
    # Job séparé (pas une étape de `checks`) : nécessite Docker (Supabase
    # local) + navigateur Chromium, sensiblement plus lent -- ne doit pas
    # ralentir le retour rapide de lint/types/tests unitaires. ubuntu-latest
    # fournit Docker nativement, aucun secret requis (Supabase local +
    # identifiants de test fixes, voir e2e/seed.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Supabase local (Docker)
        run: npx supabase start

      - name: Tests d'intégration RLS/permissions
        # Réutilise le Supabase local déjà démarré ci-dessus (même instance
        # que les specs e2e) — TEST-002/A4 (ANOMALIES.md) avait le test écrit
        # depuis le 04/09/2026 mais jamais branché en CI, seulement lancé à la
        # main (GAPS_OUVERTS.md, Phase 0).
        run: npm run test:integration

      - name: Navigateur Playwright
        # mobile-chrome (p1-2, Phase 1) réutilise le moteur chromium déjà
        # installé -- pas de nouveau binaire nécessaire pour ce projet.
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright)
        run: npm run test:e2e

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
