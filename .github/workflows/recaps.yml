name: Récaps du matin (journalier, hebdo le lundi)

# Appelle /api/recaps (p3-10) : récap du matin en push, journalier, ou hebdo
# le lundi. Deux passages (8h et 9h UTC) pour tomber sur 10h Paris été comme
# hiver : la route ne fait rien avant 10h Paris, et recap_log empêche tout
# double envoi au second passage.
on:
  schedule:
    - cron: "0 8,9 * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Appeler /api/recaps
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "https://nba-pronos.vercel.app/api/recaps"

      # Alerte minimale (Phase 0, GAPS_OUVERTS.md) : pas d'infra de monitoring
      # dédiée, une issue GitHub auto-créée suffit. Dédupliquée par titre (une
      # seule issue ouverte à la fois par workflow, pas une par run raté).
      - name: Alerter en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Échec planifié : Récaps du matin";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["cron-failure"],
              body: `Le workflow planifié a échoué. Détails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
