name: Rappel — match du soir non pronostiqué

# Appelle /api/reminders/matches (backlog "Rappels ciblés") : notifie en push
# les joueurs actifs sans prono sur un match dans les 4 prochaines heures.
# Toutes les heures — la fenêtre de 4h et la déduplication (reminder_log)
# tolèrent largement cette fréquence, pas besoin de plus.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Appeler /api/reminders/matches
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "https://nba-pronos.vercel.app/api/reminders/matches"

      # Alerte minimale (Phase 0, GAPS_OUVERTS.md) : pas d'infra de monitoring
      # dédiée, une issue GitHub auto-créée suffit. Dédupliquée par titre (une
      # seule issue ouverte à la fois par workflow, pas une par run raté).
      - name: Alerter en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Échec planifié : Rappel — match du soir non pronostiqué";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["cron-failure"],
              body: `Le workflow planifié a échoué. Détails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
