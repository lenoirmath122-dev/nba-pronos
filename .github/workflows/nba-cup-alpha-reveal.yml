name: NBA Cup Alpha — auto-révélation des matchs fictifs

# Automatise scripts/nba-cup-reveal-match.mjs (GAPS_OUVERTS.md, chantier
# "NBA Cup — Alpha Potes") : appelle /api/nba-cup-alpha/auto-reveal, qui
# révèle tout seul un match fictif dès que son scheduled_at est passé --
# même cadence que sync-results.yml (30 min) pour se comporter "comme en
# bêta", où /api/sync/results détecte tout seul qu'un vrai match est
# terminé. Mécanisme temporaire, propre à l'alpha (entity_mappings
# source_type='NBA_API') -- à supprimer une fois l'alpha terminée
# (~23/09/2026), ne touche jamais les compétitions synchronisées normalement.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Appeler /api/nba-cup-alpha/auto-reveal
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "https://nba-pronos.vercel.app/api/nba-cup-alpha/auto-reveal"

      # Alerte minimale (Phase 0, GAPS_OUVERTS.md) : pas d'infra de monitoring
      # dédiée, une issue GitHub auto-créée suffit. Dédupliquée par titre (une
      # seule issue ouverte à la fois par workflow, pas une par run raté).
      - name: Alerter en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Échec planifié : NBA Cup Alpha — auto-révélation";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["cron-failure"],
              body: `Le workflow planifié a échoué. Détails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
