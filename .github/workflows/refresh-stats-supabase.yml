name: Data NBA — rafraîchissement quotidien Supabase

# PLAN B MANUEL. Depuis le 07/10/2026 l'import quotidien tourne sur la VM
# Compute Engine `nba-refresh` (Cadrage/Stats/vm/DEPLOIEMENT_VM.md) : stats.nba.com
# bloque les IP de GitHub Actions (ReadTimeout), d'où le retrait du cron. Ce
# workflow reste disponible en lancement manuel, au cas où ce blocage serait
# levé ou pour un rattrapage ponctuel.
# NE PAS LANCER pendant un run de la VM (12h et 16h Paris) : le verrou
# d'exécution est local à la VM, deux imports simultanés se marchent dessus sur
# stats_block_events (delete + insert). `concurrency` ci-dessous ne protège que
# des autres workflows GitHub, pas du timer de la VM.
#
# Fetch incrémental nba_api -> upsert direct dans Supabase (stats_equipes/
# stats_joueurs/stats_matchs/stats_box_scores), Phase 4 du chantier Data NBA
# séparé de l'app V1 (Cadrage/Stats/projet-data-nba.md §25). N'appelle PAS le
# micro-service Cloud Run (architecture "sans état", §23) -- ce job écrit
# directement dans Supabase, le service ne fait qu'y LIRE au moment d'un
# /predict.
on:
  # `season_types` permet d'inclure la présaison ("Pre Season") pour tester la
  # résolution automatique sur un match de présaison.
  workflow_dispatch:
    inputs:
      season_types:
        description: 'Types de saison séparés par des virgules (ex. "Pre Season" ou "Pre Season,Regular Season,Playoffs,PlayIn")'
        required: false
        default: "Regular Season,Playoffs,PlayIn"

concurrency:
  group: nba-refresh-vm
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read # requis pour actions/checkout : un bloc permissions met tout scope non listé à "none"
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r Cadrage/Stats/scripts/requirements.txt
      - name: Rafraîchir les tables Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Passé par l'environnement, jamais interpolé dans le script (pas
          # d'injection de commande via l'entrée manuelle).
          SEASON_TYPES: ${{ inputs.season_types || 'Regular Season,Playoffs,PlayIn' }}
        # Mode strict : retries complets sur leaguegamefinder, job rouge si
        # l'import est incomplet, donc /api/resolve-bets non lancé.
        run: |
          IFS=',' read -ra TYPES <<< "$SEASON_TYPES"
          python Cadrage/Stats/service/refresh_daily.py --season-types "${TYPES[@]}" --strict --trigger manuel
      - name: Résoudre automatiquement les paris IA calculables (Phase 6, 22/08/2026)
        # Chaîné APRÈS le rafraîchissement ci-dessus, jamais avant : la
        # résolution a besoin des VRAIES stats de la veille tout juste
        # écrites dans Supabase par l'étape précédente (stats_box_scores) --
        # /api/sync/results (toutes les 30 min) détecte déjà qu'un match est
        # FINISHED, mais n'a pas ces stats, d'où ce 2e déclencheur ici plutôt
        # que sur ce sync existant.
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "https://nba-pronos.vercel.app/api/resolve-bets"

      # Alerte minimale (Phase 0, GAPS_OUVERTS.md) : pas d'infra de monitoring
      # dédiée, une issue GitHub auto-créée suffit. Dédupliquée par titre (une
      # seule issue ouverte à la fois par workflow, pas une par run raté).
      - name: Alerter en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Échec manuel : Data NBA — rafraîchissement quotidien Supabase";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["cron-failure"],
              body: `Le workflow manuel a échoué. Détails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
