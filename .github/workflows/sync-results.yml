name: Sync — résultats des matchs

# Appelle /api/sync/results (T4/T8) : scores + statuts, déclenche le
# recalcul du scoring. Fréquence FIXE toute l'année plutôt que bornée aux
# horaires plausibles de matchs (choix confirmé avec l'utilisateur,
# 28/07/2026, SPEC_TECHNIQUE_DEPLOIEMENT_V0.1.md §5) — plus simple à
# maintenir, le quota de 100 req/jour Highlightly reste large même à cette
# fréquence (doc maître §2, A6).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Appeler /api/sync/results
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "https://nba-pronos.vercel.app/api/sync/results"

      # Alerte minimale (Phase 0, GAPS_OUVERTS.md) : pas d'infra de monitoring
      # dédiée, une issue GitHub auto-créée suffit. Dédupliquée par titre (une
      # seule issue ouverte à la fois par workflow, pas une par run raté).
      - name: Alerter en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Échec planifié : Sync — résultats des matchs";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["cron-failure"],
              body: `Le workflow planifié a échoué. Détails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
