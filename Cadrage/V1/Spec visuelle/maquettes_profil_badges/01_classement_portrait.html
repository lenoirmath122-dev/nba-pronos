<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Classement — badge signature</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&amp;family=Sora:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1118}
a{color:#FF8A54}a:hover{color:#FF6A2B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Sora, system-ui, sans-serif; color: #F2F5FA; background: radial-gradient(120% 60% at 50% 0%, rgba(255,106,43,0.07), transparent 60%), linear-gradient(180deg, #12161F, #0E1118 40%, #0B0E14)">

  <div style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">Classement</h1>
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #E2551F; color: #0B0E14; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center" aria-hidden="true">?</span>
    </div>
    <p style="margin: 0; font-size: 14px; color: #B7C0CE">Saison régulière · Semaine 1</p>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 16px">
    <button type="button" style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: #B7C0CE; font: 600 15px Sora, sans-serif">Semaine</button>
    <button type="button" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 10px; border: 0; background: #FF6A2B; color: #0B0E14; font: 700 15px Sora, sans-serif">Général</button>
  </div>

  <div style="display: flex; align-items: center; height: 34px; margin-top: 12px; padding: 0 12px 0 14px; font-size: 12px; color: #7C8798; border-bottom: 1px solid rgba(255,255,255,0.09)">
    <span style="width: 44px">Rang</span>
    <span style="flex: 1">Joueur</span>
    <span style="width: 58px; text-align: center">Total</span>
    <span style="width: 18px"></span>
  </div>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
    <div style="{{r.rowStyle}}">
      <span style="width: 44px; display: flex; align-items: baseline; gap: 3px">
        <span style="font-family: Oswald, sans-serif; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.rank}}</span>
        <span style="{{r.trendStyle}}">{{r.trend}}</span>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px">
        <span style="{{r.avatarStyle}}">{{r.initials}}</span>
        <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600">{{r.pseudo}}</span>
        <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{ true }}">
          <dc-import name="Emblem" tier="{{r.tier}}" icon="{{r.icon}}" size="20" hint-size="20px,23px"></dc-import>
        </sc-if>
        <sc-if value="{{r.me}}" hint-placeholder-val="{{ false }}">
          <span style="flex-shrink: 0; font-size: 11px; font-weight: 700; color: #0B0E14; background: #FF6A2B; border-radius: 999px; padding: 2px 7px">Toi</span>
        </sc-if>
      </span>
      <span style="width: 58px; display: flex; justify-content: center">
        <span style="min-width: 40px; text-align: center; font-family: Oswald, sans-serif; font-size: 18px; font-weight: 700; background: rgba(255,106,43,0.16); border-radius: 6px; padding: 2px 6px; font-variant-numeric: tabular-nums">{{r.total}}</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </sc-for>

  <a href="#me" style="position: absolute; left: 12px; right: 12px; bottom: 76px; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box; border-radius: 14px; background: #161B25; border: 1px solid rgba(255,106,43,0.55); box-shadow: 0 10px 28px rgba(0,0,0,0.45); color: #F2F5FA; text-decoration: none">
    <span style="font-family: Oswald, sans-serif; font-size: 20px; font-weight: 700; width: 30px">16</span>
    <span style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,106,43,0.16); color: #FF8A54; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">RI</span>
    <span style="font-size: 15px; font-weight: 600">Rillettes-31</span>
    <dc-import name="Emblem" tier="ARGENT" icon="fork" size="20" hint-size="20px,23px"></dc-import>
    <span style="flex: 1"></span>
    <span style="font-size: 12px; color: #B7C0CE">Ta place</span>
    <span style="font-family: Oswald, sans-serif; font-size: 18px; font-weight: 700">6 pts</span>
  </a>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #0E1118; border-top: 1px solid rgba(255,255,255,0.09)">
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7C8798; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7C8798; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg>Jouer</a>
    <a href="#" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #FF6A2B; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 20V12M12 20V6M17 20v-5"></path></svg>Classement</a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7C8798; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Chat</a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7C8798; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var neutral = { bg: 'rgba(255,106,43,0.16)', fg: '#FF8A54' };
    var teams = {
      LAL: { bg: '#552583', fg: '#FDB927' },
      GSW: { bg: '#1D428A', fg: '#FFC72C' },
      NYK: { bg: '#006BB6', fg: '#F58426' },
      BOS: { bg: '#007A33', fg: '#E8D7A8' }
    };
    var data = [
      ['1', '=', 'eq', 'CY', 'cyril535', '36', 'OR', 'check', null],
      ['2', '▲1', 'up', 'VR', 'Vraiflockodu93', '36', 'ARGENT', 'repeat', null],
      ['2', '=', 'eq', 'TH', 'TheAnsw3r', '36', 'ARGENT', 'clock', null],
      ['4', '=', 'eq', 'XA', 'Xav', '33', 'BRONZE', 'heart', 'LAL'],
      ['5', '▲6', 'up', 'NO', 'nonogrobidou', '25', 'UNLOCKED', 'dice', 'GSW'],
      ['6', '=', 'eq', 'LH', 'le haricot mystérieu', '24', null, null, null],
      ['7', '▲5', 'up', 'PT', 'PtitzgegGrandreve', '23', 'BRONZE', 'copy', null],
      ['7', '▲1', 'up', 'CW', 'CWEBB', '23', 'ARGENT', 'scroll', 'NYK'],
      ['9', '▼1', 'down', 'BA', 'Batz', '22', 'BRONZE', 'check', null],
      ['10', '▼5', 'down', 'LE', 'Leopoldinho', '15', 'BRONZE', 'binoculars', 'BOS'],
      ['11', '–', 'eq', 'BB', 'Big ball', '13', null, null, null]
    ];
    var rows = data.map(function (d) {
      var c = neutral;
      var trendColor = d[2] === 'up' ? '#9FC6E0' : d[2] === 'down' ? '#8793A4' : '#5E6B7D';
      return {
        rank: d[0], trend: d[1], initials: d[3], pseudo: d[4], total: d[5],
        tier: d[6], icon: d[7], hasBadge: !!d[6], me: false,
        trendStyle: 'font-size: 10px; color: ' + trendColor,
        avatarStyle: 'width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: ' + c.bg + '; color: ' + c.fg,
        rowStyle: 'display: flex; align-items: center; height: 50px; padding: 0 12px 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06); background: ' + (d[0] === '1' || d[0] === '2' ? 'rgba(255,255,255,0.025)' : 'transparent') + '; box-shadow: ' + (d[0] === '1' || d[0] === '2' ? 'inset 3px 0 0 #FF6A2B' : 'none')
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
