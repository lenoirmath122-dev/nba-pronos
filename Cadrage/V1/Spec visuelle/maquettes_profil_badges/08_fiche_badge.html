    <div style="display: flex; gap: 6px" aria-hidden="true">

      <li style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; color: #B7C0CE">

      <li style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; font-size: 14px; color: #B7C0CE">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #6FA8FF; opacity: 0.5"></span><span style="flex: 1">Diamant</span><span style="font-family: Oswald, sans-serif">120</span><span style="width: 92px"></span></li>

    <span style="flex: 1"></span>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 6 3 3v2H6v-2l3-3z"></path></svg>
